name: Debug GitHub Context (from Chatgpt)

on:
  workflow_dispatch:
  push:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Print github.event_name
        run: echo "Event Name: ${{ github.event_name }}"

      - name: Evaluate your current expression
        with:
          current_expression: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          echo "Your Expression (from with block): ${{ inputs.current_expression }}"
          echo "Evaluated directly: ${{ github.event_name == 'workflow_dispatch' }}"

      - name: Evaluate the improved expression
        with:
          improved_expression: "${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}"
        run: |
          echo "Improved Expression (from with block): ${{ inputs.improved_expression }}"
          echo "Evaluated directly: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}"
