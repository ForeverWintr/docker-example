name: Debug GitHub Context

on:
  workflow_dispatch:
  push:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Print github.event_name
        run: |
          echo "Event Name: ${{ github.event_name }}"

      - name: Evaluate your current expression
        run: |
          echo "Your Expression: ${{ github.event_name == 'workflow_dispatch' }}"

      - name: Evaluate the improved expression
        id: improved-expression
        run: "echo Improved Expression: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}"
      - name: Evaluate the improved expression
        run: |
          echo "Improved Expression: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}"
